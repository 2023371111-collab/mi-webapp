name: CI/CD - API REST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Evita que dos despliegues se ejecuten al mismo tiempo
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mi-webapp

jobs:
  # ─────────────── 1. Integración continua: pruebas + cobertura ───────────────
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura (umbral mínimo 70%)
        run: npm test

      - name: Publicar resumen de cobertura
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["## Cobertura de código", "", "| Métrica | % | Cubierto |", "|---|---|---|",
              ...["statements","branches","functions","lines"].map(row)].join("\n"));
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ─────────────── 2. Construir y publicar la imagen en Docker Hub ───────────────
  build:
    name: Build y push a Docker Hub
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub (Personal Access Token)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen (:latest y :sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────── 3. Despliegue continuo en AWS EC2 ───────────────
  deploy:
    name: Desplegar en AWS EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y actualizar el contenedor
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,SHA
          script_stop: true
          script: |
            set -e
            echo "==> Descargando $IMAGE:$SHA"
            docker pull "$IMAGE:$SHA"

            PREV=$(docker inspect --format '{{.Config.Image}}' api 2>/dev/null || true)
            echo "==> Versión anterior: ${PREV:-ninguna}"

            echo "==> Deteniendo contenedor anterior"
            docker stop api 2>/dev/null || true
            docker rm api 2>/dev/null || true

            echo "==> Levantando nueva versión en el puerto 80"
            docker run -d --name api --restart unless-stopped \
              -p 80:3000 -v api-data:/app/data "$IMAGE:$SHA"

            echo "==> Verificando /api/health"
            for i in $(seq 1 15); do
              if curl -fsS http://localhost/api/health; then
                echo; echo "==> Despliegue exitoso"
                docker image prune -af --filter "until=24h" >/dev/null || true
                exit 0
              fi
              sleep 2
            done

            echo "==> La nueva versión no respondió; restaurando la anterior"
            docker logs api --tail 50 || true
            docker rm -f api || true
            if [ -n "$PREV" ]; then
              docker run -d --name api --restart unless-stopped -p 80:3000 -v api-data:/app/data "$PREV"
            fi
            exit 1

      - name: Verificar la API pública
        run: curl -fsS "http://${{ secrets.EC2_HOST }}/api/health"
